syntax = "proto3";

package ratelimit.v1;

option go_package = "github.com/Alkarim786/distributed-rate-limiter/gen/ratelimit/v1;ratelimitv1";

// RateLimiter decides whether a caller identified by `key` may perform an
// action governed by the named rule.
service RateLimiter {
  // Check consumes `cost` units from the rule's budget for `key` if enough
  // budget is available. It never blocks waiting for budget.
  rpc Check(CheckRequest) returns (CheckResponse);

  // ListRules returns the rules this server was configured with.
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
}

enum Algorithm {
  ALGORITHM_UNSPECIFIED = 0;
  ALGORITHM_TOKEN_BUCKET = 1;
  ALGORITHM_SLIDING_WINDOW_LOG = 2;
  ALGORITHM_SLIDING_WINDOW_COUNTER = 3;
}

message CheckRequest {
  // Name of a configured rule, e.g. "api-per-user".
  string rule = 1;
  // Identity being limited, e.g. a user id, API key or client IP.
  string key = 2;
  // Units to consume. 0 is treated as 1.
  int64 cost = 3;
}

message CheckResponse {
  bool allowed = 1;
  int64 limit = 2;
  // Budget left after this request (never negative).
  int64 remaining = 3;
  // When denied: milliseconds until a request of the same cost could succeed.
  int64 retry_after_ms = 4;
  // Milliseconds until the budget is fully restored.
  int64 reset_after_ms = 5;
  Algorithm algorithm = 6;
}

message ListRulesRequest {}

message Rule {
  string name = 1;
  Algorithm algorithm = 2;
  int64 limit = 3;
  // Window length for sliding-window algorithms, refill period for token bucket.
  int64 window_ms = 4;
}

message ListRulesResponse {
  repeated Rule rules = 1;
}
